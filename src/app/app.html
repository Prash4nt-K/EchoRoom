<main class="app-shell" [class.dark-theme]="isDarkMode()">
  <nav class="navbar" aria-label="Main navigation">
    <a class="brand" href="/" aria-label="EchoRoom home">EchoRoom</a>
    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        role="switch"
        [attr.aria-checked]="isDarkMode()"
        [class.is-on]="isDarkMode()"
        (click)="toggleTheme()"
      >
        <span class="theme-switch" aria-hidden="true">
          <span class="theme-switch-thumb">
            {{ isDarkMode() ? '☾' : '☀' }}
          </span>
        </span>
        <span>{{ isDarkMode() ? 'Lights on?' : 'Lights off?' }}</span>
      </button>
      <div class="online-count" aria-label="People online">
        <span class="status-dot"></span>
        <span>{{ participants().length }} online</span>
      </div>
    </div>
  </nav>

  <section class="watch-room" aria-label="Watch room">
    <section class="video-section" aria-label="Shared video">
      <div class="video-frame">
        <iframe
          #player
          [class.is-paused]="!isPlaying()"
          [src]="videoUrl()"
          title="Shared YouTube video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
        @if (!isPlaying()) {
          <div class="video-overlay" aria-live="polite">Video is paused</div>
        }
      </div>

      <button class="play-toggle" type="button" (click)="togglePlayback()">
        {{ isPlaying() ? 'Pause' : 'Play' }}
      </button>

      <form class="video-link-form" (ngSubmit)="loadVideo()">
        <label for="youtubeLink">YouTube link</label>
        <input
          id="youtubeLink"
          name="youtubeLink"
          type="url"
          placeholder="Paste a YouTube link to watch together"
          [(ngModel)]="youtubeLink"
        />
        <button type="submit">Load</button>
      </form>
    </section>

    <section class="chat-panel" aria-label="Chat">
      <header class="chat-header">
        <h1>Chat</h1>
        <div class="people-list" aria-label="People in chat">
          @for (person of participants(); track person) {
            <span [class.is-you]="person === 'You'">{{ person }}</span>
          }
        </div>
      </header>

      <section
        #chatArea
        class="chat-area"
        aria-label="Messages"
        (scroll)="onChatScroll()"
      >
        @for (message of messages(); track message.id) {
          <article class="message" [class.is-you]="message.isYou">
            <div class="message-meta">
              <span>{{ message.author }}</span>
            </div>
            <p>{{ message.text }}</p>
          </article>
        }
      </section>

      @if (unreadMessageCount() > 0) {
        <button class="unread-notice" type="button" (click)="scrollToUnreadMessages()">
          {{ unreadMessageCount() }}
          {{ unreadMessageCount() === 1 ? 'new message' : 'new messages' }}
        </button>
      }

      <form class="composer" (ngSubmit)="sendMessage()">
        <label for="messageInput">Message</label>
        <input
          id="messageInput"
          name="message"
          type="text"
          autocomplete="off"
          placeholder="Type a message..."
          [(ngModel)]="draft"
        />
        <button type="submit">Send</button>
      </form>
    </section>
  </section>
</main>
